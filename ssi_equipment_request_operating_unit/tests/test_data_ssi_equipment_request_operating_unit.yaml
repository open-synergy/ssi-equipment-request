scenarios:
  - name: "Create Equipment Request with Operating Unit"
    steps:
      - step: "Create equipment request type"
        action: "create"
        model: "equipment_request_type"
        save_as: "er_type"
        values:
          name: "Test Equipment Request Type OU"
          code: "TERTOU001"

      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        as_user: "base.user_admin"
        values:
          name: "OU Test Employee"

      - step: "Create equipment_request with operating_unit_id"
        action: "create"
        model: "equipment_request"
        save_as: "record"
        as_user: "base.user_admin"
        values:
          date: "2026-01-15"
          date_due: "2026-02-15"
          type_id: "REC: er_type.id"
          employee_id: "REC: employee.id"
          operating_unit_id: "REF: operating_unit.main_operating_unit"

      - step: "Assert operating_unit_id is set"
        action: "assert"
        target: "record"
        asserts:
          operating_unit_id:
            type: "value"
            operator: "is_truthy"

  - name: "User without operating unit access cannot read or write equipment_request"
    steps:
      - step: "Create equipment request type"
        action: "create"
        model: "equipment_request_type"
        save_as: "er_type"
        values:
          name: "Test Type Restricted OU"
          code: "TTROU001"

      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        as_user: "base.user_admin"
        values:
          name: "OU Test Employee Restricted"

      - step: "Create restricted operating unit"
        action: "create"
        model: "operating.unit"
        save_as: "ou_restricted"
        values:
          name: "OU Restricted Test Equipment Request"
          code: "OURESTRICTEDTESTER"
          partner_id: "REC: company.partner_id.id"

      - step: "Create user without access to main operating unit"
        action: "create"
        model: "res.users"
        save_as: "restricted_user"
        values:
          name: "Restricted OU User Equipment Request"
          login: "restricted_ou_user_er@example.com"
          groups_id:
            - - 6
              - 0
              - - "REF: base.group_user"
                - "REF: ssi_equipment_request.equipment_request_user_group"
                - "REF: ssi_equipment_request_operating_unit.equipment_request_ou_group"
          assigned_operating_unit_ids:
            - - 6
              - 0
              - - "REC: ou_restricted.id"

      - step: "Create equipment_request with main operating unit"
        action: "create"
        model: "equipment_request"
        save_as: "record"
        as_user: "base.user_admin"
        values:
          date: "2026-01-15"
          date_due: "2026-02-15"
          type_id: "REC: er_type.id"
          employee_id: "REC: employee.id"
          operating_unit_id: "REF: operating_unit.main_operating_unit"

      - step: "Restricted user cannot read the record"
        action: "call"
        target: "record"
        method: "read"
        args:
          - - "date"
        as_user: "restricted_user"
        expect_error:
          type: "AccessError"

      - step: "Restricted user cannot write the record"
        action: "write"
        target: "record"
        as_user: "restricted_user"
        expect_error:
          type: "AccessError"
        values:
          date_due: "2026-03-15"
